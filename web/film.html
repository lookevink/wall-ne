<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wall-ne · Season film</title><link rel="stylesheet" href="/brand.css"><link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48"><script type="importmap">{"imports":{"three":"/vendor/three.module.js","@dgreenheck/ez-tree":"/vendor/ez-tree/ez-tree.es.js"}}</script>
<style>
  body {margin:0;background:#161818;color:#eee8d9;font:13px 'Helvetica Neue',Arial,sans-serif}
  main {display:grid;gap:16px;padding:20px;max-width:1280px;margin:auto}
  header {display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  h1 {font:600 20px 'Helvetica Neue',Arial,sans-serif;margin:0 auto 0 0}
  label {display:flex;align-items:center;gap:6px;color:#c3bba8;font-size:12px}
  input {width:72px;background:#202423;color:#eee8d9;border:1px solid #625e53;border-radius:7px;padding:7px}
  button {background:linear-gradient(#f85241,#c52620);color:#fff6e7;border:1px solid #ff7260;border-radius:9px;padding:9px 14px;font-weight:700;cursor:pointer}
  button:disabled {opacity:.5;cursor:default}
  #preview {width:100%;height:auto;aspect-ratio:16/9;background:#0d0f0f;border-radius:12px;border:1px solid #3a3a34}
  #status {font:12px ui-monospace,monospace;color:#c3bba8;min-height:18px;overflow-wrap:anywhere}
  #stage {position:fixed;left:-4000px;top:0;width:960px;height:540px;overflow:hidden}
</style></head>
<body>
<main>
  <header><h1>Season film</h1><label>Seed <input id="seed" type="number" min="0" max="100000" value="7"></label><label>Days <input id="days" type="number" min="1" max="60" value="14"></label><button id="render">Render film</button></header>
  <canvas id="preview" width="1920" height="1080" aria-label="Film frame preview"></canvas>
  <p id="status">Each frame is computed from the seed: the same seed renders the same film. Frames save under .runtime/timelapse; the MP4 is encoded when the last frame is saved.</p>
</main>
<div id="stage" aria-hidden="true"></div>
<script type="module" src="/film.js"></script>
</body></html>
